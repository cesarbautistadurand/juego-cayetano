<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Cartesiana - Cayetano</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- PANTALLA 1: Registro del Alumno -->
    <div id="pantalla-login">
        <h1>Misión Cartesiana</h1>
        <h2>Bachillerato Cayetano</h2>
        <p>Ingresa tu nombre para entrar a la batalla:</p>
        <input type="text" id="inputNombre" placeholder="Tu nombre o apellido">
        <button id="btnEntrar">ENTRAR AL JUEGO</button>
    </div>

    <!-- PANTALLA 2: El Juego -->
    <div id="pantalla-juego" style="display: none;">
        <div id="contenedor">
            <div id="cabecera-juego">
                <h1>BACHILLERATO CAYETANO</h1>
                <div id="panel-reloj">⏱️ 02:00</div>
            </div>
            
            <!-- Contenedor del plano -->
            <div id="contenedor-plano">
                <canvas id="plano" width="600" height="400"></canvas>
                <p id="mensaje" style="opacity: 1;">Esperando jugadores...</p>
                
                <!-- Panel central de alertas y cuenta regresiva -->
                <div id="alerta-central" style="display: none;">
                    <h2 id="texto-alerta">¡LISTOS!</h2>
                </div>
            </div>
            
            <!-- Controles -->
            <div id="controles">
                <input type="text" id="inputCoordenadas" placeholder="Ej: (3,-2)">
                <button id="btnDisparar">DISPARAR</button>
            </div>
        </div>

        <!-- Tabla de Ranking a un costado -->
        <div id="contenedor-ranking">
            <h3>🏆 RANKING EN VIVO</h3>
            <ul id="listaRanking">
            </ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="juego.js?v=3"></script>
</body>
</html>
